[package]
name = "throttle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
breakpad-symbols = "0.27.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
debugid = "0.8.0"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
hex = "0.4.3"
hmac = "0.13.0"
minidump = "0.27.0"
minidump-processor = "0.27.0"
minidump-unwind = "0.27.0"
minijinja = "2.24.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
minidump-synth = "0.27.0"
tempfile = "3.27.0"
test-assembler = "0.1.6"
tower = { version = "0.5.3", features = ["util"] }
